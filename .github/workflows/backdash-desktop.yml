# Build installateur Windows Autovia dans le cloud (GitHub) — pas sur la machine du développeur.
name: Backdash Desktop (Windows)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backdash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backdash/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build desktop installer
        env:
          VITE_BACKDASH_URL: https://app.autovia.space
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:desktop

      - name: Prepare autovia-setup.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in backdash/release" }
          New-Item -ItemType Directory -Force -Path ../public/downloads | Out-Null
          Copy-Item $exe.FullName ../public/downloads/autovia-setup.exe
          Write-Host "Packaged: $($exe.Name) -> public/downloads/autovia-setup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autovia-setup-windows
          path: public/downloads/autovia-setup.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: public/downloads/autovia-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
